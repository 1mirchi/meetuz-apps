<button id="share">Download Fairy + Open WhatsApp</button>
<div id="status"></div>
</main>
<script>
const image=document.getElementById("fairy");
const button=document.getElementById("share");
const status=document.getElementById("status");

button.addEventListener("click",async()=>{
  try{
    status.textContent="Creating local JPEG file...";
    const canvas=document.createElement("canvas");
    canvas.width=image.naturalWidth;
    canvas.height=image.naturalHeight;
    const ctx=canvas.getContext("2d");
    ctx.drawImage(image,0,0);

    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.95));
    if(!blob) throw new Error("Could not create image file.");

    const file=new File([blob],"fairymagic-share.jpg",{type:"image/jpeg"});

    const url=URL.createObjectURL(file);
    const link=document.createElement("a");
    link.href=url;
    link.download=file.name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);

    status.textContent="File downloaded. Opening WhatsApp Web — attach the downloaded JPG manually.";
    window.open("https://web.whatsapp.com/","_blank","noopener,noreferrer");
  }catch(error){
    console.error(error);
    status.textContent="Test failed: "+error.message;
  }
});
</script>
